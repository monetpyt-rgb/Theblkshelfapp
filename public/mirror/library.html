async function supabaseFetch(path) {
  const pageSize = 500;
  let from = 0;
  let allRows = [];

  while (true) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        Accept: "application/json",
        Range: `${from}-${from + pageSize - 1}`,
        Prefer: "count=exact"
      }
    });

    if (!res.ok) {
      throw new Error(`Supabase request failed: ${res.status}`);
    }

    const rows = await res.json();
    allRows = allRows.concat(rows);

    if (rows.length < pageSize) break;

    from += pageSize;
  }

  return allRows;
}

let featuredAuthors = featuredRows

if (!featuredAuthors.length) {

    let shuffledBooks = books;

  function getUniqueValues(items, field) {
    return [...new Set(
      items
        .map(item => normalizeText(item[field]))
        .filter(Boolean)
    )].sort((a, b) => a.localeCompare(b));
  }

  function getUniqueFlattenedValues(items, field) {
    return [...new Set(
      items.flatMap(item => Array.isArray(item[field]) ? item[field] : [])
        .map(value => normalizeText(value))
        .filter(Boolean)
    )].sort((a, b) => a.localeCompare(b));
  }

  function getUniqueCommaSeparatedValues(items, field) {
  return [...new Set(
    items
      .flatMap(item => normalizeText(item[field]).split(","))
      .map(value => normalizeText(value))
      .filter(Boolean)
  )].sort((a, b) => a.localeCompare(b));
}

  function normalizeText(value) {
  return String(value || "").trim();
}

function normalizeForSearch(value) {
  return String(value || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/['’]/g, "")
    .replace(/[^a-z0-9]+/g, " ")
    .trim();
}

function normalizeMonthKey(value) {
  if (!value) return "";

  const raw = String(value).trim();

  if (/^\d{4}-\d{2}$/.test(raw)) return raw;

  const date = new Date(raw);
  if (!Number.isNaN(date.getTime())) {
    return date.toISOString().slice(0, 7);
  }

  return raw;
}

function getSearchScore(book, query) {
  if (!query) return 0;

  const title = normalizeForSearch(book.title);
  const series = normalizeForSearch(book.series);
  const author = normalizeForSearch(book.authorName);

  const contributors = Array.isArray(book.contributors)
    ? book.contributors.map(normalizeForSearch).join(" ")
    : normalizeForSearch(book.contributors);

  const target =
    state.searchType === "title-series"
      ? `${title} ${series}`.trim()
      : `${author} ${contributors}`.trim();

  if (target === query) return 100;
  if (target.includes(query)) return 85;

  const queryWords = query.split(" ").filter(Boolean);

  if (!queryWords.length) return 0;

  let matchedWords = 0;

  queryWords.forEach(word => {
    if (target.includes(word)) {
      matchedWords++;
    }
  });

  const matchRatio = matchedWords / queryWords.length;

  return matchRatio >= 0.6
    ? Math.round(matchRatio * 60)
    : 0;
}

function shuffleArray(items) {
  const copy = [...items];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function applySavedShuffleOrder(items, savedOrder) {
  let orderedIds = [];

  try {
    orderedIds = JSON.parse(savedOrder);
  } catch (_) {
    sessionStorage.removeItem("library_shuffle_order");
    return shuffleArray(items);
  }

  const itemMap = new Map(
    items
      .filter(book => book.bookId)
      .map(book => [book.bookId, book])
  );

  const orderedItems = orderedIds
    .map(id => itemMap.get(id))
    .filter(Boolean);

  const orderedIdSet = new Set(orderedIds);

  const newItems = items.filter(book => !orderedIdSet.has(book.bookId));

  return [...orderedItems, ...newItems];
}

function applyUrlFilter(paramName, stateSet, chipContainerId, groupId) {
  const params = new URLSearchParams(window.location.search);
  const value = normalizeText(params.get(paramName));

  if (!value) return;

  stateSet.clear();

  const chips = document.querySelectorAll(
    `#${chipContainerId} .filter-chip`
  );

  chips.forEach(chip => {
    const chipValue = normalizeText(chip.dataset.value);
    const match =
  normalizeForSearch(chipValue) === normalizeForSearch(value);

    chip.classList.toggle("active", match);

    if (match) {
      stateSet.add(chipValue);
    }
  });

  if (stateSet.size) {
    document.getElementById(groupId)?.setAttribute("open", "open");
  }
}

function applyRankingUrlFilter() {

  const params = new URLSearchParams(window.location.search);
  const ranking = normalizeText(params.get("ranking"));

  if (!ranking) return;

  state.rankingFilter.clear();

  document.querySelectorAll(".ranking-filter-chip").forEach(chip => {

    const value = chip.dataset.rankingFilter;

    const match = value.toLowerCase() === ranking.toLowerCase();

    chip.classList.toggle("active", match);

    if (match) {
      state.rankingFilter.add(value);
    }

  });

  if (state.rankingFilter.size) {
    document
      .getElementById("ranking-filter-group")
      ?.setAttribute("open", "open");
  }
}

  function applyFilters() {
  filteredBooks = allBooks.filter(book => {
    const searchScore = getSearchScore(book, state.authorQuery);
    const genre = normalizeText(book.genre);
    const subGenres = Array.isArray(book.subGenres) ? book.subGenres.map(normalizeText) : [];
    const ageRange = normalizeText(book.ageRange);
    const spiceLevel = normalizeText(book.spiceLevel);
    const formats = Array.isArray(book.availableFormats)
  ? book.availableFormats.map(normalizeText).filter(Boolean)
  : splitCommaList(book.availableFormats).map(normalizeText);

const matchesFormat =
  state.formats.size === 0 ||
  formats.some(format => state.formats.has(format));

const lengthCategory = normalizeText(book.lengthCategory);

const matchesLength =
  state.lengths.size === 0 ||
  state.lengths.has(lengthCategory);
    const vibes = Array.isArray(book.vibes) ? book.vibes.map(normalizeText) : [];

    const matchesSearch =
  !state.authorQuery || searchScore > 0;

book._searchScore = searchScore;

    const matchesGenre =
      state.genres.size === 0 || state.genres.has(genre);

    const matchesSubGenre =
      state.subGenres.size === 0 || subGenres.some(sub => state.subGenres.has(sub));

    const matchesVibe =
      state.vibes.size === 0 || vibes.some(vibe => state.vibes.has(vibe));

    const matchesAge =
      state.ageRanges.size === 0 || state.ageRanges.has(ageRange);

    const matchesSpice =
      state.spiceLevels.size === 0 || state.spiceLevels.has(spiceLevel);

    const matchesRepresentation =
  state.representations.size === 0 ||
  representations.some(rep => state.representations.has(rep));

    const isTrending = trendingBookIds.has(book.bookId);

    const now = new Date();
now.setHours(0, 0, 0, 0);

const newReleaseCutoff = new Date(now);
newReleaseCutoff.setDate(newReleaseCutoff.getDate() - NEW_RELEASE_WINDOW_DAYS);

const releaseDate = parseLocalDate(book.releaseDate);
const releaseTime = releaseDate ? releaseDate.getTime() : 0;
const hasValidReleaseDate = !!releaseDate;

const isUpcomingRelease =
  hasValidReleaseDate && releaseTime >= now.getTime();

const isNewRelease =
  hasValidReleaseDate &&
  releaseTime < now.getTime() &&
  releaseTime >= newReleaseCutoff.getTime();

const isFeaturedAuthor = featuredAuthorIds.has(book.authorId);

const matchesRankingFilter =
  state.rankingFilter.size === 0 ||
  (state.rankingFilter.has("trending") && isTrending) ||
  (state.rankingFilter.has("new-releases") && isNewRelease) ||
  (state.rankingFilter.has("upcoming-releases") && isUpcomingRelease) ||
  (state.rankingFilter.has("featured-authors") && isFeaturedAuthor);

    return matchesSearch &&
   matchesGenre &&
   matchesSubGenre &&
   matchesVibe &&
   matchesAge &&
   matchesSpice &&
   matchesRepresentation &&
   matchesFormat &&
   matchesLength &&
   matchesRankingFilter;
  });

  if (state.authorQuery && state.sortBy === "default") {
  filteredBooks.sort((a, b) => (b._searchScore || 0) - (a._searchScore || 0));
} else {
  sortFilteredBooks();
}

  page = 1;
  renderCase();
  updateResultsTop();
}

       

  function sortFilteredBooks() {
  if (state.sortBy === "title-asc") {
    filteredBooks.sort((a, b) =>
      normalizeText(a.title).localeCompare(normalizeText(b.title))
    );
    return;
  }

  if (state.sortBy === "title-desc") {
    filteredBooks.sort((a, b) =>
      normalizeText(b.title).localeCompare(normalizeText(a.title))
    );
    return;
  }

  if (state.sortBy === "newest") {
    filteredBooks.sort((a, b) => {
      const dateA = parseLocalDate(a.releaseDate);
      const dateB = parseLocalDate(b.releaseDate);

      return (dateB ? dateB.getTime() : 0) -
             (dateA ? dateA.getTime() : 0);
    });
    return;
  }

  if (state.sortBy === "oldest") {
    filteredBooks.sort((a, b) => {
      const dateA = parseLocalDate(a.releaseDate);
      const dateB = parseLocalDate(b.releaseDate);

      return (dateA ? dateA.getTime() : Number.MAX_SAFE_INTEGER) -
             (dateB ? dateB.getTime() : Number.MAX_SAFE_INTEGER);
    });
    return;
  }
}

function splitCommaList(value) {
  if (!value) return [];

  if (Array.isArray(value)) {
    return value
      .map(item => String(item || "").trim())
      .filter(Boolean);
  }

  const raw = String(value).trim();

  if (!raw) return [];

  try {
    const parsed = JSON.parse(raw);

    if (Array.isArray(parsed)) {
      return parsed
        .map(item => String(item || "").trim())
        .filter(Boolean);
    }
  } catch (_) {
    // The value is a regular comma-separated string.
  }

  return raw
    .split(",")
    .map(item =>
      item
        .trim()
        .replace(/^\[+/, "")
        .replace(/\]+$/, "")
        .replace(/^["']+|["']+$/g, "")
        .trim()
    )
    .filter(Boolean);
}

  function parseLocalDate(value) {
  if (!value) return null;

  const raw = String(value).trim();

  const isoDateOnly = raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (isoDateOnly) {
    return new Date(
      Number(isoDateOnly[1]),
      Number(isoDateOnly[2]) - 1,
      Number(isoDateOnly[3])
    );
  }

  const date = new Date(raw);
  return Number.isNaN(date.getTime()) ? null : date;
}

function getLengthCategory(wordCount, pageCount) {

  const words = Number(wordCount) || 0;
  const pages = Number(pageCount) || 0;

  if (words > 0) {

    if (words < 10000) return "Lil' Snack";
    if (words < 30000) return "Quick Sip";
    if (words < 60000) return "Got Some Time";
    if (words < 100000) return "Locked In";
    if (words < 150000) return "Thickems";

    return "Don't Bother Me";
  }

  if (pages > 0) {

    if (pages < 40) return "Lil' Snack";
    if (pages < 120) return "Quick Sip";
    if (pages < 240) return "Got Some Time";
    if (pages < 400) return "Locked In";
    if (pages < 600) return "Thickems";

    return "Don't Bother Me";
  }

  return "";
}

function getReleaseBadgeLabel(book) {
  const releaseDate = parseLocalDate(book.releaseDate);
  if (!releaseDate) return "";

  const now = new Date();
  now.setHours(0, 0, 0, 0);

  const newReleaseCutoff = new Date(now);
  newReleaseCutoff.setDate(newReleaseCutoff.getDate() - NEW_RELEASE_WINDOW_DAYS);

  if (releaseDate >= now) {
    return "Upcoming";
  }

  if (releaseDate >= newReleaseCutoff && releaseDate < now) {
    return "Fresh";
  }

  return "";
}

        container.appendChild(dots);

    }

    const start=Math.max(2,page-2);
    const end=Math.min(maxPage-1,page+2);

    addButton(1);

    if(start>2){
        addDots();
    }

    for(let i=start;i<=end;i++){
        addButton(i);
    }

    if(end<maxPage-1){
        addDots();
    }

    if(maxPage>1){
        addButton(maxPage);
    }

}

  setupAccordionFilters();
  loadLibrary();
</script>

async function loadIncludes() {

  const header = await fetch('includes/header.html');
  document.getElementById('site-header').innerHTML =
    await header.text();

  const footer = await fetch('includes/footer.html');
  document.getElementById('site-footer').innerHTML =
    await footer.text();
}

loadIncludes();
</script>
