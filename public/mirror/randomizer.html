  <title>Pick My BLK Read – The Blk Shelf</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />

  <link
    rel="stylesheet"
    href="includes/shared.css"
  />

  <style>

    :root {
      --bg: #0f0c0a;
      --bg-soft: #171310;
      --panel: #1d1814;
      --panel-2: #241d17;

      --text: #fff8f0;
      --muted: #e3d2c0;
      --soft: #c9b7a5;

      --accent: #d8a35d;
      --accent-light: #f2c994;

      --rust: #8f412c;

      --line: rgba(255,255,255,0.18);

      --max: 1280px;
    }


    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      color: var(--text);

      line-height: 1.6;

      background:
        linear-gradient(
          rgba(15,12,10,.52),
          rgba(15,12,10,.52)
        ),
        url("https://njgprucvnayyiooiftaw.supabase.co/storage/v1/object/public/logo/bckgrnd.png");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }


    /* ==================================
       PAGE
    ================================== */

    .randomizer-page {
      padding: 3rem 0 5rem;
    }


    .randomizer-shell {
      position: relative;

      overflow: hidden;

      min-height: 720px;

      padding:
        clamp(2rem, 5vw, 4.5rem)
        clamp(1.25rem, 5vw, 4rem);

      background:
        linear-gradient(
          145deg,
          rgba(63,46,35,.96),
          rgba(22,17,13,.98)
        );

      border:
        1px solid
        rgba(255,255,255,.22);

      border-radius: 30px;

      box-shadow:
        0 25px 70px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.05);
    }


    .randomizer-shell::before {
      content: "";

      position: absolute;

      inset: 14px;

      border:
        1px solid
        rgba(216,163,93,.15);

      border-radius: 23px;

      pointer-events: none;
    }


    .randomizer-shell::after {
      content: "";

      position: absolute;

      inset: 0;

      opacity: .06;

      pointer-events: none;

      background:
        repeating-linear-gradient(
          97deg,
          transparent 0,
          transparent 7px,
          rgba(255,255,255,.25) 8px,
          transparent 9px
        );
    }


    .randomizer-content {
      position: relative;

      z-index: 2;
    }


    /* ==================================
       HEADER
    ================================== */

    .randomizer-heading {
      text-align: center;

      max-width: 760px;

      margin:
        0 auto
        2.5rem;
    }


    .randomizer-eyebrow {
      display: inline-block;

      margin-bottom: .9rem;

      color: var(--accent-light);

      font-size: .76rem;

      font-weight: bold;

      letter-spacing: .17em;

      text-transform: uppercase;
    }


    .randomizer-heading h1 {
      margin: 0;

      font-size:
        clamp(2.8rem, 7vw, 6rem);

      line-height: .88;

      letter-spacing: -.045em;

      text-transform: uppercase;
    }


    .randomizer-heading p {
      margin:
        1.25rem auto
        0;

      color: var(--muted);

      font-size: 1.05rem;
    }


    /* ==================================
       RANDOMIZER STAGE
    ================================== */

    .randomizer-stage {
      position: relative;

      min-height: 390px;

      display: grid;

      place-items: center;
    }


    /* ==================================
   THE BLK SHELF SEARCH
================================== */

.blk-search {
  position: relative;

  width:
    min(980px, 96vw);

  height:
    390px;

  margin:
    0 auto;

  overflow: hidden;

  isolation: isolate;
}


/*
  Dark center haze.
  Keeps the flying covers from
  looking too clean or digital.
*/

.blk-search::before {
  content: "";

  position: absolute;

  inset: 0;

  z-index: 0;

  pointer-events: none;

  background:
    radial-gradient(
      circle at center,
      rgba(143,65,44,.15),
      transparent 34%
    ),
    radial-gradient(
      circle at center,
      transparent 28%,
      rgba(7,5,4,.48) 86%
    );
}


/*
  Subtle grit over the entire search.
*/

.blk-search::after {
  content: "";

  position: absolute;

  inset: 0;

  z-index: 50;

  pointer-events: none;

  opacity: .09;

  background:
    repeating-linear-gradient(
      101deg,
      transparent 0,
      transparent 9px,
      rgba(255,255,255,.15) 10px,
      transparent 11px
    );
}


/* ==================================
   FLYING BOOKS
================================== */

.search-book {
  position: absolute;

  width: 105px;

  aspect-ratio:
    2 / 3;

  z-index: 4;

  pointer-events: none;

  opacity: 0;

  transform-origin:
    center;

  will-change:
    transform,
    opacity;
}


.search-book img {
  display: block;

  width: 100%;
  height: 100%;

  object-fit: cover;

  border:
    3px solid
    rgba(236,218,192,.82);

  box-shadow:
    10px 13px 18px
    rgba(0,0,0,.48);
}


/* ==================================
   BOOKS FLYING LEFT → RIGHT
================================== */

.search-book.fly-right {
  left: -145px;

  animation:
    flyRight
    var(--fly-speed, .95s)
    cubic-bezier(.25,.1,.78,.95)
    forwards;
}


@keyframes flyRight {

  0% {
    opacity: 0;

    transform:
      translateX(0)
      translateY(0)
      rotate(var(--start-rotate, -14deg))
      scale(.82);
  }

  10% {
    opacity: .95;
  }

  70% {
    opacity: 1;

    transform:
      translateX(850px)
      translateY(var(--fly-y, 10px))
      rotate(var(--mid-rotate, 6deg))
      scale(1.03);
  }

  100% {
    opacity: 0;

    transform:
      translateX(1250px)
      translateY(var(--fly-end-y, -15px))
      rotate(var(--end-rotate, 15deg))
      scale(.9);
  }

}


/* ==================================
   BOOKS FLYING RIGHT → LEFT
================================== */

.search-book.fly-left {
  right: -145px;

  animation:
    flyLeft
    var(--fly-speed, .95s)
    cubic-bezier(.25,.1,.78,.95)
    forwards;
}


@keyframes flyLeft {

  0% {
    opacity: 0;

    transform:
      translateX(0)
      translateY(0)
      rotate(var(--start-rotate, 12deg))
      scale(.85);
  }

  10% {
    opacity: .95;
  }

  70% {
    opacity: 1;

    transform:
      translateX(-850px)
      translateY(var(--fly-y, -12px))
      rotate(var(--mid-rotate, -5deg))
      scale(1.04);
  }

  100% {
    opacity: 0;

    transform:
      translateX(-1250px)
      translateY(var(--fly-end-y, 20px))
      rotate(var(--end-rotate, -16deg))
      scale(.9);
  }

}


/* ==================================
   CENTER REJECTION BOOK
================================== */

.search-book.reject {
  left: 50%;
  top: 50%;

  width:
    clamp(115px, 16vw, 150px);

  z-index: 25;

  animation:
    rejectBook
    .74s
    cubic-bezier(.16,.8,.24,1)
    forwards;
}


@keyframes rejectBook {

  0% {
    opacity: 0;

    transform:
      translate(-50%, -50%)
      translateY(-80px)
      rotate(-10deg)
      scale(1.25);
  }

  32% {
    opacity: 1;

    transform:
      translate(-50%, -50%)
      translateY(5px)
      rotate(2deg)
      scale(.97);
  }

  52% {
    opacity: 1;

    transform:
      translate(-50%, -50%)
      rotate(-2deg)
      scale(1.03);
  }

  72% {
    opacity: 1;

    transform:
      translate(-50%, -50%)
      translateX(-10px)
      rotate(-5deg)
      scale(1);
  }

  100% {
    opacity: 0;

    transform:
      translate(-50%, -50%)
      translateX(370px)
      translateY(45px)
      rotate(22deg)
      scale(.77);
  }

}


/* ==================================
   REJECTION STAMP
================================== */

.reject-stamp {
  position: absolute;

  left: 50%;
  top: 45%;

  z-index: 30;

  min-width:
    max-content;

  padding:
    .32rem
    .55rem;

  background:
    var(--rust);

  border:
    2px solid
    #f1dcc1;

  color:
    #fff8f0;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  font-size:
    .72rem;

  font-weight:
    900;

  letter-spacing:
    .12em;

  text-transform:
    uppercase;

  box-shadow:
    4px 5px 0
    rgba(0,0,0,.38);

  transform:
    translate(-50%, -50%)
    rotate(-8deg);

  animation:
    stampHit
    .24s
    cubic-bezier(.2,1.4,.3,1)
    forwards;
}


@keyframes stampHit {

  0% {
    opacity: 0;

    transform:
      translate(-50%, -50%)
      rotate(-14deg)
      scale(1.8);
  }

  100% {
    opacity: 1;

    transform:
      translate(-50%, -50%)
      rotate(-8deg)
      scale(1);
  }

}


/* ==================================
   RESTING COVER MESS
================================== */

.search-book.resting {
  opacity: .42;

  filter:
    saturate(.75)
    brightness(.72);

  animation:
    restingBookIn
    .45s ease
    forwards;
}


@keyframes restingBookIn {

  from {
    opacity: 0;

    transform:
      translateY(25px)
      rotate(var(--rest-rotate))
      scale(.9);
  }

  to {
    opacity: .42;

    transform:
      translateY(0)
      rotate(var(--rest-rotate))
      scale(1);
  }

}


/* ==================================
   CENTER COMMENTARY
================================== */

.search-center-message {
  position: absolute;

  left: 50%;
  top: 50%;

  z-index: 40;

  transform:
    translate(-50%, -50%)
    rotate(-1.5deg);

  padding:
    .6rem
    .9rem;

  background:
    #e7d6bc;

  color:
    #17110d;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  font-size:
    clamp(.78rem, 2vw, 1rem);

  font-weight:
    900;

  letter-spacing:
    .1em;

  text-transform:
    uppercase;

  white-space: nowrap;

  box-shadow:
    7px 8px 0
    rgba(0,0,0,.45);

  animation:
    noteSlam
    .25s
    cubic-bezier(.2,1.45,.3,1);
}


.search-center-message::before {
  content: "";

  position: absolute;

  inset: -5px;

  z-index: -1;

  border:
    1px solid
    rgba(231,214,188,.32);

  transform:
    rotate(2deg);
}


@keyframes noteSlam {

  from {
    opacity: 0;

    transform:
      translate(-50%, -50%)
      rotate(5deg)
      scale(1.45);
  }

  to {
    opacity: 1;

    transform:
      translate(-50%, -50%)
      rotate(-1.5deg)
      scale(1);
  }

}


/* ==================================
   WINNER APPROACH
================================== */

.search-book.search-winner {
  left: 50%;
  top: 50%;

  width:
    clamp(145px, 21vw, 205px);

  z-index: 45;

  opacity: 1;

  animation:
    winnerApproach
    1.05s
    cubic-bezier(.14,.83,.25,1)
    forwards;
}


.search-book.search-winner img {
  border:
    5px solid
    #eadac0;

  box-shadow:
    17px 20px 0
    rgba(143,65,44,.55),
    25px 30px 35px
    rgba(0,0,0,.5);
}


@keyframes winnerApproach {

  0% {
    opacity: 0;

    transform:
      translate(-50%, -50%)
      translateZ(0)
      scale(.28)
      rotate(7deg);
  }

  55% {
    opacity: 1;

    transform:
      translate(-50%, -50%)
      scale(.78)
      rotate(-4deg);
  }

  82% {
    transform:
      translate(-50%, -50%)
      scale(1.08)
      rotate(-1deg);
  }

  100% {
    transform:
      translate(-50%, -50%)
      scale(1)
      rotate(-2deg);
  }

}


/* tiny impact on the whole area */
.blk-search.winner-hit {
  animation:
    searchImpact
    .22s linear;
}


@keyframes searchImpact {

  0% {
    transform:
      translate(0,0);
  }

  25% {
    transform:
      translate(-3px,2px);
  }

  50% {
    transform:
      translate(3px,-2px);
  }

  75% {
    transform:
      translate(-2px,-1px);
  }

  100% {
    transform:
      translate(0,0);
  }

}


/* ==================================
   MOBILE
================================== */

@media (max-width: 700px) {

  .blk-search {
    height:
      345px;
  }


  .search-book {
    width:
      78px;
  }


  .search-book.reject {
    width:
      115px;
  }


  .search-book.search-winner {
    width:
      150px;
  }


  .search-center-message {
    max-width:
      86%;

    white-space:
      normal;

    text-align:
      center;
  }


  .reject-stamp {
    font-size:
      .58rem;
  }

}


    /* ==================================
       STATUS MESSAGE
    ================================== */

    .randomizer-status {
      margin:
        2rem 0
        0;

      text-align: center;

      color: var(--soft);

      font-style: italic;

      min-height: 1.6em;
    }


    .randomizer-status.flash {
      animation:
        statusFlash
        .18s ease;
    }

    .randomizer-status.loading {
  color: var(--accent-light);
  font-size: clamp(1rem, 2.5vw, 1.35rem);
  font-weight: bold;
  font-style: normal;
  letter-spacing: .04em;
  text-transform: uppercase;
}

.loading-dots {
  display: inline-block;
  width: 1.5em;
  text-align: left;
}

.loading-dots::after {
  content: "";
  animation: diggingDots 1.1s steps(4, end) infinite;
}

@keyframes diggingDots {
  0% {
    content: "";
  }

  25% {
    content: ".";
  }

  50% {
    content: "..";
  }

  75%,
  100% {
    content: "...";
  }
}


    @keyframes statusFlash {

      from {
        opacity: .1;

        transform:
          translateY(5px);
      }

      to {
        opacity: 1;

        transform:
          translateY(0);
      }

    }


    /* ==================================
       RESULT
    ================================== */

    .randomizer-result {
      width:
        min(780px, 100%);

      grid-template-columns:
        minmax(190px, 285px)
        minmax(0, 1fr);

      align-items: center;

      gap:
        clamp(2rem, 6vw, 4rem);

      margin:
        0 auto;
    }


    .randomizer-result:not([hidden]) {
      display: grid;
    }


    .result-cover-wrap {
      position: relative;
    }


    .result-cover-wrap::before {
      content: "";

      position: absolute;

      inset:
        14px
        -17px
        -16px
        17px;

      background:
        var(--rust);

      transform:
        rotate(4deg);
    }

    .shelf-spoken-stamp {
  position: absolute;

  right: -48px;
  bottom: -24px;

  z-index: 3;

  padding:
    .48rem
    .68rem;

  background:
    var(--rust);

  border:
    2px solid
    #e7d6bc;

  color:
    #fff8f0;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  font-size:
    .66rem;

  font-weight:
    900;

  line-height:
    1.05;

  letter-spacing:
    .11em;

  text-align:
    center;

  transform:
    rotate(8deg)
    scale(0);

  box-shadow:
    5px 6px 0
    rgba(0,0,0,.4);

  pointer-events: none;
}


.randomizer-result.land
.shelf-spoken-stamp {
  animation:
    shelfStamp
    .28s
    .43s
    cubic-bezier(.2,1.45,.3,1)
    forwards;
}


@keyframes shelfStamp {

  from {
    opacity: 0;

    transform:
      rotate(14deg)
      scale(1.7);
  }

  to {
    opacity: 1;

    transform:
      rotate(8deg)
      scale(1);
  }

}


    .result-cover {
      position: relative;

      display: block;

      width: 100%;

      aspect-ratio:
        2 / 3;

      object-fit: cover;

      border:
        6px solid
        #eadac0;

      box-shadow:
        18px 22px 0
        rgba(0,0,0,.35);

      transform:
        rotate(-2deg);
    }


    .randomizer-result.land
    .result-cover {
      animation:
        bookLand
        .6s
        cubic-bezier(.17,.9,.28,1.3);
    }


    @keyframes bookLand {

      0% {
        opacity: 0;

        transform:
          translateY(-85px)
          rotate(-11deg)
          scale(1.13);
      }

      65% {
        opacity: 1;

        transform:
          translateY(9px)
          rotate(1deg)
          scale(.97);
      }

      82% {
        transform:
          translateY(-4px)
          rotate(-3deg)
          scale(1.02);
      }

      100% {
        transform:
          translateY(0)
          rotate(-2deg)
          scale(1);
      }

    }


    .result-verdict {
      display: inline-block;

      margin:
        0 0
        1rem;

      padding:
        .42rem
        .75rem;

      background:
        var(--rust);

      color:
        #fff8f0;

      font-size:
        .8rem;

      font-weight:
        900;

      letter-spacing:
        .12em;

      text-transform:
        uppercase;

      transform:
        rotate(-1deg);
    }


    .result-title {
      margin: 0;

      font-size:
        clamp(2.2rem, 5vw, 4rem);

      line-height:
        .95;

      letter-spacing:
        -.035em;
    }


    .result-author {
      margin:
        .8rem 0
        1.2rem;

      color:
        var(--muted);

      font-size:
        1.07rem;
    }


    .result-tags {
  display: flex;

  flex-wrap: wrap;

  gap: .5rem;

  margin-bottom: .85rem;
}


.result-context {
  margin:
    0 0
    1.6rem;

  color:
    var(--soft);

  font-size:
    .82rem;

  font-style:
    italic;
}


    .result-tag {
      display:
        inline-flex;

      padding:
        .38rem
        .62rem;

      border:
        1px solid
        rgba(216,163,93,.3);

      border-radius:
        999px;

      background:
        rgba(216,163,93,.08);

      color:
        var(--muted);

      font-size:
        .79rem;
    }


    .result-button {
      display:
        inline-block;

      padding:
        .9rem
        1.2rem;

      background:
        #e6b06a;

      border:
        2px solid
        #120e0b;

      color:
        #120e0b;

      font-weight:
        bold;

      text-decoration:
        none;

      transform:
        rotate(.5deg);

      transition:
        .18s ease;
    }


    .result-button:hover {
      background:
        #f2c994;

      transform:
        rotate(-1deg)
        translateY(-2px);
    }


    /* ==================================
       CONTROLS
    ================================== */

    /* ==================================
   READER PREFERENCES
================================== */

.randomizer-preferences {
  width:
    min(760px, 100%);

  margin:
    2.5rem auto 0;

  text-align: center;
}


.preferences-toggle {
  appearance: none;

  display: inline-flex;

  align-items: center;

  gap: .65rem;

  padding:
    .72rem
    1rem;

  border: 0;

  background: none;

  color:
    var(--accent-light);

  font-family:
    inherit;

  font-size:
    1rem;

  font-weight:
    bold;

  cursor: pointer;
}


.preferences-toggle span {
  border-bottom:
    1px solid
    rgba(242,201,148,.4);

  padding-bottom:
    2px;
}


.preferences-toggle i {
  font-size:
    .72rem;

  transition:
    transform .2s ease;
}


.preferences-toggle[aria-expanded="true"]
i {
  transform:
    rotate(180deg);
}


.preferences-toggle:hover {
  color:
    #fff8f0;
}


/* ==================================
   OPEN PANEL
================================== */

.preferences-panel {
  position: relative;

  margin:
    1rem auto
    .8rem;

  padding:
    1.5rem
    clamp(1rem, 4vw, 2rem);

  text-align: left;

  background:
    rgba(20,15,12,.72);

  border:
    1px solid
    rgba(216,163,93,.22);

  box-shadow:
    8px 10px 0
    rgba(0,0,0,.22);
}


.preferences-panel::before {
  content: "";

  position: absolute;

  inset: 6px;

  pointer-events: none;

  border:
    1px solid
    rgba(255,255,255,.035);
}


.preferences-intro {
  position: relative;

  margin:
    0 0
    1.4rem;

  color:
    var(--muted);

  font-style:
    italic;

  text-align: center;

  font-size:
    .9rem;
}


/* ==================================
   GROUPS
================================== */

.preference-group {
  position: relative;

  padding:
    1rem 0;

  border-top:
    1px solid
    rgba(255,255,255,.08);
}


.preference-group:first-of-type {
  border-top: 0;
}


.preference-label {
  margin-bottom:
    .65rem;

  color:
    var(--accent-light);

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  font-size:
    .67rem;

  font-weight:
    900;

  letter-spacing:
    .15em;
}


/* ==================================
   CHIPS

async function supabaseFetch(path) {

  const pageSize = 500;

  let from = 0;

  let allRows = [];


  while (true) {

    const response =
      await fetch(
        `${SUPABASE_URL}/rest/v1/${path}`,
        {
          headers: {
            apikey:
              SUPABASE_ANON_KEY,

            Authorization:
              `Bearer ${SUPABASE_ANON_KEY}`,

            Accept:
              "application/json",

            Range:
              `${from}-${from + pageSize - 1}`,

            Prefer:
              "count=exact"
          }
        }
      );


    if (!response.ok) {

      throw new Error(
        `Supabase request failed: ${response.status}`
      );

    }


    const rows =
      await response.json();


    allRows =
      allRows.concat(rows);


    if (
      rows.length < pageSize
    ) {

      break;

    }


    from += pageSize;

  }


  return allRows;

}



function splitCommaList(value) {

  if (!value) {

    return [];

  }


  if (Array.isArray(value)) {

    return value
      .map(item =>
        String(item || "").trim()
      )
      .filter(Boolean);

  }


  const raw =
    String(value).trim();


  if (!raw) {

    return [];

  }


  try {

    const parsed =
      JSON.parse(raw);


    if (Array.isArray(parsed)) {

      return parsed
        .map(item =>
          String(item || "").trim()
        )
        .filter(Boolean);

    }

  } catch (_) {}


  return raw
    .split(",")
    .map(item =>
      item
        .trim()
        .replace(/^\[+/, "")
        .replace(/\]+$/, "")
        .replace(/^["']+|["']+$/g, "")
        .trim()
    )
    .filter(Boolean);

}



function buildCoverUrl(path) {

  if (!path) {

    return DEFAULT_COVER;

  }


  return (
    `${SUPABASE_URL}` +
    `/storage/v1/object/public/covers/` +
    encodeURIComponent(path)
  );

}



function randomItem(items) {

  return items[
    Math.floor(
      Math.random() * items.length
    )
  ];

}



function shuffleArray(items) {

  const copy =
    [...items];


  for (
    let i = copy.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );


    [
      copy[i],
      copy[j]
    ] = [
      copy[j],
      copy[i]
    ];

  }


  return copy;

}



function sleep(milliseconds) {

  return new Promise(resolve =>
    setTimeout(
      resolve,
      milliseconds
    )
  );

}

function preloadImage(url) {
  return new Promise(resolve => {
    const img = new Image();

    img.onload = async () => {
      /*
        decode() makes sure the browser has
        actually decoded the image and can
        paint it immediately.
      */
      try {
        if (img.decode) {
          await img.decode();
        }
      } catch (_) {}

      resolve(true);
    };

    img.onerror = () => {
      resolve(false);
    };

    img.src = url;
  });
}


async function prepareAnimationBooks(
  eligibleBooks,
  winningBook
) {
  const candidates =
    shuffleArray(
      eligibleBooks.filter(
        book =>
          book.bookId !==
          winningBook.bookId
      )
    )
    .slice(
      0,
      ANIMATION_POOL_SIZE - 1
    );

  const pool = [
    winningBook,
    ...candidates
  ];

  animationBooks = [];

  /*
    Start loading all selected covers,
    but add each book to the usable pool
    as soon as its image is ready.
  */
  pool.forEach(book => {

    const img =
      new Image();

    img.onload =
      async () => {

        try {

          if (img.decode) {
            await img.decode();
          }

        } catch (_) {}

        if (
          !animationBooks.some(
            item =>
              item.bookId ===
              book.bookId
          )
        ) {

          animationBooks.push(
            book
          );

        }

      };

    img.src =
      book.cover;

  });


  /*
    Don't hold up the show waiting
    for every single cover.
  */
  const startedAt =
    Date.now();

  const MAX_WAIT =
    850;

  const MIN_READY =
    6;


  while (
    animationBooks.length <
      MIN_READY &&
    Date.now() -
      startedAt <
      MAX_WAIT
  ) {

    await sleep(
      50
    );

  }


  /*
    Fall back gracefully if the
    connection is especially slow.
  */
  if (!animationBooks.length) {

    animationBooks =
      pool.slice(
        0,
        Math.min(
          4,
          pool.length
        )
      );

  }
}

function uniqueValues(
  values
) {

  return [
    ...new Set(
      values
        .map(value =>
          String(value || "").trim()
        )
        .filter(Boolean)
    )
  ].sort(
    (a, b) =>
      a.localeCompare(b)
  );

}


function buildPreferenceChip(
  container,
  value,
  preferenceSet
) {

  const button =
    document.createElement(
      "button"
    );


  button.type =
    "button";


  button.className =
    "preference-chip";


  button.textContent =
    value;


  button.addEventListener(
    "click",
    () => {

      if (
        preferenceSet.has(value)
      ) {

        preferenceSet.delete(
          value
        );


        button.classList.remove(
          "selected"
        );

      } else {

        preferenceSet.add(
          value
        );


        button.classList.add(
          "selected"
        );

      }


      updatePreferenceSummary();

    }
  );


  container.appendChild(
    button
  );

}

function getEligibleBooks() {

  return books.filter(book => {

    const matchesGenre =
      preferences.genres.size === 0 ||
      preferences.genres.has(
        book.genre
      );


    const matchesVibe =
      preferences.vibes.size === 0 ||
      book.vibes.some(vibe =>
        preferences.vibes.has(
          vibe
        )
      );


    const matchesSpice =
      preferences.spice.size === 0 ||
      preferences.spice.has(
        book.spiceLevel
      );


    const matchesAge =
      preferences.age.size === 0 ||
      preferences.age.has(
        book.ageRange
      );


    return (
      matchesGenre &&
      matchesVibe &&
      matchesSpice &&
      matchesAge
    );

  });

}


/* ==================================
   SUMMARY
================================== */

function updatePreferenceSummary() {

  const selections = [

    ...preferences.genres,

    ...preferences.vibes,

    ...preferences.spice,

    ...preferences.age

  ];


  const hasFilters =
    selections.length > 0;


  if (!hasFilters) {

    preferenceSummary.textContent =
      "The whole shelf is fair game.";


    preferenceSummary
      .classList
      .remove(
        "has-filters"
      );

      preferenceSummary
  .classList
  .remove(
    "no-matches"
  );


    clearPreferences.hidden =
      true;


    randomizeButton.disabled =
      !books.length;


    return;

  }


  const eligibleCount =
    getEligibleBooks().length;

    preferenceSummary
  .classList
  .toggle(
    "no-matches",
    eligibleCount === 0
  );


  preferenceSummary
    .classList
    .add(
      "has-filters"
    );


  clearPreferences.hidden =
    false;


  if (
    eligibleCount === 0
  ) {

    preferenceSummary.textContent =
      "You got real specific. The Shelf has questions.";


    randomizeButton.disabled =
      true;


    return;

  }


  if (
    eligibleCount === 1
  ) {

    preferenceSummary.textContent =
      "1 book understood the assignment.";

  } else {

    preferenceSummary.textContent =
      `${eligibleCount.toLocaleString()} books understood the assignment.`;

  }


  randomizeButton.disabled =
    false;

}


/* ==================================
   LOAD BOOKS
================================== */

async function loadBooks() {

  try {

    const rows =
      await supabaseFetch(
        "public_library_books?select=Book_ID,Author_Name,Title,CoverImagePath,Genre,Sub_Genres,Vibes,Spice_Level,Age_Range,Available_Formats"
      );


    books =
      rows
        .filter(row =>
          row.Book_ID &&
          row.Title
        )
        .map(row => ({

          bookId:
            row.Book_ID,

          title:
            row.Title ||
            "Untitled Book",

          authorName:
            row.Author_Name ||
            "Unknown Author",

          cover:
            buildCoverUrl(
              row.CoverImagePath
            ),

          genre:
            row.Genre || "",

          subGenres:
            splitCommaList(
              row.Sub_Genres
            ),

          vibes:
            splitCommaList(
              row.Vibes
            ),

          spiceLevel:
            row.Spice_Level || "",

          ageRange:
            row.Age_Range || "",

          formats:
            splitCommaList(
              row.Available_Formats
            )

        }));


    if (!books.length) {

      statusEl.textContent =
        "The shelf is empty. That seems suspicious.";

      return;

    }


    buildRestingSearch();


buildPreferenceOptions();


updatePreferenceSummary();


statusEl.textContent =
  `${books.length.toLocaleString()} books. Good luck.`;


    randomizeButton.disabled =
      false;


  } catch (error) {

    console.error(
      "Randomizer load failed:",
      error
    );


    statusEl.textContent =
      "The shelf is acting up right now.";

  }

}

/* ==================================
   CREATE SEARCH BOOK
================================== */

function createSearchBook(
  book,
  className = ""
) {

  const wrapper =
    document.createElement(
      "div"
    );


  wrapper.className =
    `search-book ${className}`;


  const img =
    document.createElement(
      "img"
    );


  img.src =
    book.cover;


  img.alt =
    book.title;


  img.onerror =
    () => {

      img.onerror =
        null;


      img.src =
        DEFAULT_COVER;

    };


  wrapper.appendChild(
    img
  );


  return wrapper;

}


/* ==================================
   RESTING CHAOS
================================== */

function buildRestingSearch() {

  searchChaos.innerHTML =
    "";


  searchCenterMessage.hidden =
    true;


  const restingBooks =
    shuffleArray(books)
      .slice(
        0,
        Math.min(
          books.length,
          7
        )
      );


  const positions = [

    {
      left: "5%",
      top: "17%",
      rotate: "-11deg"
    },

    {
      left: "19%",
      top: "39%",
      rotate: "7deg"
    },

    {
      left: "35%",
      top: "10%",
      rotate: "-4deg"
    },

    {
      left: "55%",
      top: "37%",
      rotate: "8deg"
    },

    {
      left: "72%",
      top: "12%",
      rotate: "-7deg"
    },

    {
      left: "84%",
      top: "43%",
      rotate: "10deg"
    },

    {
      left: "44%",
      top: "52%",
      rotate: "-9deg"
    }

  ];


  restingBooks.forEach(
    (book, index) => {

      const card =
        createSearchBook(
          book,
          "resting"
        );


      const position =
        positions[
          index %
          positions.length
        ];


      card.style.left =
        position.left;


      card.style.top =
        position.top;


      card.style.setProperty(
        "--rest-rotate",
        position.rotate
      );


      searchChaos.appendChild(
        card
      );

    }
  );

}


/* ==================================
   FLYING COVER
================================== */

function throwBook() {

  const book =
    randomItem(
      animationBooks.length
        ? animationBooks
        : books
    );


  const direction =
    Math.random() > .5
      ? "fly-right"
      : "fly-left";


  const card =
    createSearchBook(
      book,
      direction
    );


  card.style.top =
    `${15 + Math.random() * 58}%`;


  card.style.setProperty(
    "--fly-speed",
    `${.62 + Math.random() * .55}s`
  );


  card.style.setProperty(
    "--start-rotate",
    `${-18 + Math.random() * 36}deg`
  );


  card.style.setProperty(
    "--mid-rotate",
    `${-8 + Math.random() * 16}deg`
  );


  card.style.setProperty(
    "--end-rotate",
    `${-22 + Math.random() * 44}deg`
  );


  card.style.setProperty(
    "--fly-y",
    `${-35 + Math.random() * 70}px`
  );


  card.style.setProperty(
    "--fly-end-y",
    `${-50 + Math.random() * 100}px`
  );


  searchChaos.appendChild(
    card
  );


  setTimeout(
    () => card.remove(),
    1500
  );

}


/* ==================================
   REJECT A BOOK
================================== */

function rejectBook(
  message
) {

  const book =
    randomItem(
      animationBooks.length
        ? animationBooks
        : books
    );


  const card =
    createSearchBook(
      book,
      "reject"
    );


  const stamp =
    document.createElement(
      "span"
    );


  stamp.className =
    "reject-stamp";


  stamp.textContent =
    message;


  card.appendChild(
    stamp
  );


  searchChaos.appendChild(
    card
  );


  setTimeout(
    () => card.remove(),
    850
  );

}

   CENTER MESSAGE
================================== */

function showSearchMessage(

) {

  searchCenterMessage.hidden =

/* ==================================
   PICK WINNER
================================== */

function pickBook() {

  const eligibleBooks =
    getEligibleBooks();


  if (!eligibleBooks.length) {

    return null;

  }


  if (
    eligibleBooks.length === 1
  ) {

    lastBookId =
      eligibleBooks[0].bookId;


    return eligibleBooks[0];

  }


  let book;


  do {

    book =
      randomItem(
        eligibleBooks
      );

  } while (
    book.bookId ===
    lastBookId
  );


  lastBookId =
    book.bookId;


  return book;

}

   STATUS
================================== */

    message;


  statusEl.classList.remove(

  statusEl.classList.add(

}

}


function clearDiggingStatus() {

}


/* ==================================
   RESULT TAGS
================================== */

function buildResultTags(book) {

  const tags =
    [];


  if (book.genre) {

    tags.push(
      book.genre
    );

  }


  book.vibes
    .slice(0, 2)
    .forEach(vibe => {

      if (
        !tags.includes(vibe)
      ) {

        tags.push(
          vibe
        );

      }

    });


  resultTags.innerHTML =
    "";


  tags.forEach(tag => {

    const span =
      document.createElement(
        "span"
      );


    span.className =
      "result-tag";


    span.textContent =
      tag;


    resultTags.appendChild(
      span
    );

  });

}

);


const eligibleBooks =

const hasPreferences =

if (hasPreferences) {

} else {

resultLink.href =

  );

againButton.hidden =

/* ==================================
   BLK SHELF REACTIONS
================================== */

function getPreferenceReaction() {

  const selectedGenres =
    [...preferences.genres]
      .map(value =>
        value.toLowerCase()
      );


  const selectedVibes =
    [...preferences.vibes]
      .map(value =>
        value.toLowerCase()
      );


  const selectedSpice =
    [...preferences.spice]
      .map(value =>
        value.toLowerCase()
      );


  const selectedAge =
    [...preferences.age]
      .map(value =>
        value.toLowerCase()
      );


  const hasSelections =
    selectedGenres.length ||
    selectedVibes.length ||
    selectedSpice.length ||
    selectedAge.length;


  if (!hasSelections) {

    return randomItem([
      "No guidance whatsoever. Bold.",
      "The whole shelf? Okay then.",
      "We're just trusting the process today."
    ]);

  }


  const allSelections = [

    ...selectedGenres,
    ...selectedVibes,
    ...selectedSpice,
    ...selectedAge

  ].join(" ");


  const isDark =
    allSelections.includes(
      "dark"
    );


  const isCozy =
    allSelections.includes(
      "cozy"
    );


  const isFunny =
    allSelections.includes(
      "funny"
    ) ||
    allSelections.includes(
      "humor"
    ) ||
    allSelections.includes(
      "comedy"
    );


  const isEmotional =
    allSelections.includes(
      "emotional"
    ) ||
    allSelections.includes(
      "angst"
    );


  const isRomance =
    selectedGenres.some(
      genre =>
        genre.includes(
          "romance"
        )
    );


  const isFantasy =
    selectedGenres.some(
      genre =>
        genre.includes(
          "fantasy"
        )
    );


  const isHorror =
    selectedGenres.some(
      genre =>
        genre.includes(
          "horror"
        )
    );


  const soundsSpicy =
    selectedSpice.some(
      spice =>
        spice.includes(
          "spicy"
        ) ||
        spice.includes(
          "high"
        ) ||
        spice.includes(
          "explicit"
        ) ||
        spice.includes(
          "4"
        ) ||
        spice.includes(
          "5"
        )
    );


  if (
    isDark &&
    soundsSpicy
  ) {

    return randomItem([
      "Oh. So we're making decisions tonight.",
      "Dark AND spicy? Okay then.",
      "We see what kind of night this is."
    ]);

  }


  if (
    isRomance &&
    soundsSpicy
  ) {

    return randomItem([
      "Romance with seasoning. Heard.",
      "Oh, you came with instructions.",
      "Say less."
    ]);

  }


  if (
    isDark &&
    isRomance
  ) {

    return randomItem([
      "Love, but make it complicated. Got it.",
      "Oh. You want problems.",
      "Healthy choices were not requested."
    ]);

  }


  if (isCozy) {

    return randomItem([
      "Okay. Something soft. We can do soft.",
      "A little peace for once. Fine.",
      "Cozy. Look at you choosing tranquility."
    ]);

  }


  if (isHorror) {

    return randomItem([
      "So peace was never the goal.",
      "You want to sleep eventually, right?",
      "Okay. Something unsettling."
    ]);

  }


  if (isFunny) {

    return randomItem([
      "You need a laugh. We can work with that.",
      "Okay. Let's find you some foolishness.",
      "Funny. Got it."
    ]);

  }


  if (isEmotional) {

    return randomItem([
      "You want feelings. A lot of them apparently.",
      "So we're crying today.",
      "Emotional damage. Coming right up."
    ]);

  }


  if (isFantasy) {

    return randomItem([
      "Reality wasn't doing it for you anyway.",
      "Leaving this world for a minute. Understood.",
      "Fantasy. Let's go somewhere else."
    ]);

  }


  return randomItem([
    "Okay. The Shelf has a direction.",
    "Specific enough to be dangerous.",
    "We can work with this.",
    "Oh, you actually came prepared."
  ]);

}


/* ==================================
   RUN RANDOMIZER
================================== */

/* ==================================
   RUN THE BLK SHELF SEARCH
================================== */

async function runRandomizer() {

  if (!books.length) {

    return;

  }


  preferencesPanel.hidden =
  true;


preferencesToggle
  .setAttribute(
    "aria-expanded",
    "false"
  );


await sleep(
  100
);


const randomizerStage =
  document.querySelector(
    ".randomizer-stage"
  );


randomizerStage.scrollIntoView({
  behavior: "smooth",
  block: "start"
});


await sleep(
  500
);


const winningBook =

  pickBook();

    if (!winningBook) {

  updateStatus(
    "Okay... even we can't find that."
  );


  showSearchMessage(
    "YOU GOT VERY SPECIFIC."
  );


  randomizeButton.disabled =
    false;


  return;

}

const eligibleBooks =
  getEligibleBooks();

/*
  Make the preload feel like part
  of The Shelf's search.
*/
showDiggingStatus();

await prepareAnimationBooks(
  eligibleBooks,
  winningBook
);

clearDiggingStatus();

updateStatus(
  getPreferenceReaction()
);

    const prefersReducedMotion =
  window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches;


if (
  skipAnimation.checked ||
  prefersReducedMotion
) {

  randomizeButton.disabled =
    true;

  againButton.hidden =
    true;

  randomizerResult.hidden =
    true;

  blkSearch.hidden =
    true;

  updateStatus(
    "Fine. No theatrics."
  );

  await sleep(
    180
  );

  showResult(
    winningBook
  );

  randomizeButton.disabled =
    false;

  return;

}


  randomizeButton.disabled =
    true;


  againButton.hidden =
    true;


  randomizerResult.hidden =
    true;


  randomizerResult
    .classList
    .remove(
      "land"
    );


  blkSearch.hidden =
    false;


  blkSearch.classList.remove(
    "winner-hit"
  );


  searchChaos.innerHTML =
    "";


  searchCenterMessage.hidden =
    true;


  /*
    ACT ONE:
    The Shelf starts rummaging.
  */

  updateStatus(
  getPreferenceReaction()
);


  let throwing = true;


  const throwLoop =
    setInterval(
      () => {

        if (throwing) {

          throwBook();

          if (
            Math.random() > .72
          ) {

            setTimeout(
              throwBook,
              90
            );

          }

        }

      },
      190
    );


  await sleep(
    650
  );


  showSearchMessage(
    "INTERESTING."
  );


  await sleep(
    380
  );


  searchCenterMessage.hidden =
    true;


  /*
    ACT TWO:
    The Shelf starts rejecting things.
  */

  rejectBook(
    "NOPE."
  );


  updateStatus(
    "Nope."
  );


  await sleep(
    620
  );


  rejectBook(
    "NOT THAT ONE."
  );


  updateStatus(
    "Not that one."
  );


  await sleep(
    650
  );


  rejectBook(
    "TOO EASY."
  );


  updateStatus(
    "Your TBR is already ridiculous."
  );


  await sleep(
    620
  );


  rejectBook(
    "KEEP LOOKING."
  );


  updateStatus(
    "Keep looking..."
  );


  await sleep(
    600
  );


  /*
    ACT THREE:
    Something catches The Shelf's eye.
  */

  throwing =
    false;


  clearInterval(
    throwLoop
  );


  await sleep(
    250
  );


  searchChaos.innerHTML =
    "";


  showSearchMessage(
    "WAIT."
  );


  updateStatus(
    "Wait."
  );


  await sleep(
    600
  );


  showSearchMessage(
    "HOLD ON..."
  );


  updateStatus(
    "Hold on."
  );


  await sleep(
    650
  );


  searchCenterMessage.hidden =
    true;


  updateStatus(
    "Oh."
  );


  await sleep(
    300
  );


  /*
    ACT FOUR:
    Winner comes out of the darkness.
  */

  showSearchWinner(
    winningBook
  );


  updateStatus(
    "Now this looks promising."
  );


  await sleep(
    1050
  );


  updateStatus(
    "Yeah. This one."
  );


  await sleep(
    850
  );


  /*
    Existing full result reveal.
  */

  showResult(
    winningBook
  );


  randomizeButton.disabled =
    false;

}


/* ==================================
   BUTTONS
================================== */

randomizeButton

againButton

  );


/* ==================================
   START
================================== */

loadBooks();

</script>
